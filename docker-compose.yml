services:
  db:
    image: postgres:16
    container_name: quantweave-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantweave
      POSTGRES_USER: quantweave
      POSTGRES_PASSWORD: quantweave_dev
    ports:
      - "5432:5432"
    volumes:
      - quantweave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantweave -d quantweave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quantweave-redis
    ports:
      - "6379:6379"
    profiles: ["workers"]

volumes:
  quantweave_pgdata:
