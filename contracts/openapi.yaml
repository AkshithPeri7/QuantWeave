openapi: 3.1.0
info:
  title: QuantWeave API
  version: 1.0.0
  description: Initial API contract. Expand schemas and security requirements as milestones are implemented.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: quantweave-api }
  /api/v1/stocks/search:
    get:
      summary: Search instruments
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Matching instruments
  /api/v1/stocks/{symbol}/prices:
    get:
      summary: Get historical daily prices
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string }
        - in: query
          name: start
          schema: { type: string, format: date }
        - in: query
          name: end
          schema: { type: string, format: date }
      responses:
        "200":
          description: Price observations with source and freshness metadata
  /api/v1/portfolios:
    get:
      summary: List current user's portfolios
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Portfolio list }
    post:
      summary: Create portfolio
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Portfolio created }
  /api/v1/portfolios/{portfolio_id}/transactions:
    post:
      summary: Record a portfolio transaction
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: portfolio_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Transaction recorded }
  /api/v1/funds/search:
    get:
      summary: Search mutual fund schemes
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200": { description: Matching schemes }
  /api/v1/ai/chat:
    post:
      summary: Ask a grounded QuantWeave assistant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Answer with citations, metrics and limitations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
